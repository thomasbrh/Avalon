    <link rel="icon" type="image/png" sizes="16x16" href="/favicon_io/favicon-16x16.png">

    <link rel="preconnect" href="https://fonts.googleapis.com">

<body>

    <!-- overlay chargement -->
    <div class="loading-overlay" aria-hidden="true">
        <div class="loading-text">0%</div>

        <div class="loading-bar__container">
            <div class="loading-bar"></div>
        </div>
    </div>


    <button class="btn start-experience hidden">Entrer</button>


    <nav class="header">
        <a href="https://www.thomasbruch.be/portfolio/" class="header__credit" target="_blank__portfolio">Thomas Bruch — TFE 2025-2026</a>
        <a href="https://avalon-landing-zeta.vercel.app/" target="_blank__landing" class="header__logo">Avalon</a>
    </nav>

    <button class="btn btn--small audio-btn">Son</button>

    
    <div class="indicators" id="indicators">
        <div class="indicator" id="next-indicator" style="display: none; top: 50%; left: 50%;">
            <div class="group">
                <span class="center"></span>
                <span class="circle circle-0"></span>
                <span class="circle circle-1"></span>
                <span class="circle circle-2"></span>
            </div>
        </div>
    </div>
    
    
    <!-- dialogue -->
    <div class="dialogue-box">
        <span class="dialogue-speaker"></span>
        <p class="dialogue-text"></p>
    </div>

    
    <!-- choix -->
    <div id="choices-container"></div>


    <canvas class="webgl" aria-hidden="true"></canvas>


    <!-- script -->
    <script type="module" src="./script.js"></script>
