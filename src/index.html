<!DOCTYPE html>
<html lang="fr">

<head>
    <title>La dernière quête - Avalon</title>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="description" content="Une expérience interactive et narrative sur le mythe d'Avalon.">
    <meta name="author" content="Thomas Bruch">

    <!-- SEO -->
    <meta name="robots" content="index, follow">
    <link rel="canonical" href="https://avalon-gules.vercel.app">

    <!-- favicon -->
    <link rel="apple-touch-icon" sizes="180x180" href="/favicon_io/apple-touch-icon.png">
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon_io/favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon_io/favicon-16x16.png">
    <link rel="manifest" href="/favicon_io/site.webmanifest">

    <!-- meta partage -->
    <meta property="og:site_name" content="La dernière quête">
    <meta property="og:title" content="La dernière quête - Expérience">
    <meta property="og:description" content="Une expérience interactive et narrative sur le mythe d'Avalon.">
    <meta property="og:type" content="website">
    <meta property="og:url" content="https://avalon-gules.vercel.app">
    <meta property="og:image" content="/og-image.png">
    <meta property="og:image:width" content="1920">
    <meta property="og:image:height" content="945">

    <!-- fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Faculty+Glyphic&family=Uncial+Antiqua&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="./styles/style.scss">

    
</head>

<body>

    <!-- overlay chargement -->
    <div class="loading-overlay" aria-hidden="true">
        <div class="loading-text">0%</div>

        <div class="loading-bar__container">
            <div class="loading-bar"></div>
        </div>
    </div>


    <!-- start -->
    <button class="btn start-experience hidden">Entrer</button>
    <!-- end -->
    <button class="btn end-experience hidden">À suivre</button>

    <!-- navigation chapitres -->
    <nav class="header">
        <button class="chapter-menu__toggle" type="button" aria-label="Menu des chapitres">
            <span></span>
            <span></span>
            <span></span>
        </button>

        <a href="https://avalon-landing-zeta.vercel.app/" target="_blank" class="header__logo">AVALON</a>

        <div class="chapter-menu" id="chapter-menu">
            <div class="chapter-menu__panel">
                <a href="https://avalon-landing-zeta.vercel.app/" target="_blank" class="chapter-menu__landing">Retour landing</a>
                <button class="chapter-menu__item" type="button" data-chapter="portal">Chapitre 1 - Le portail</button>
                <button class="chapter-menu__item" type="button" data-chapter="lake">Chapitre 2 - Le lac</button>
                <button class="chapter-menu__item" type="button" data-chapter="sword">Chapitre 3 - L'&eacute;p&eacute;e</button>
                <button class="chapter-menu__item" type="button" data-chapter="manor">Chapitre 4 - Le manoir</button>
                <a href="https://www.thomasbruch.be/portfolio/" class="chapter-menu__credit" target="_blank">Thomas Bruch - TFE 2025-2026</a>
            </div>
        </div>
    </nav>

    <button class="btn btn--small audio-btn">Son</button>

    <div class="indicators" id="indicators">
        <div class="indicator" id="next-indicator" style="display: none; top: 50%; left: 50%;">
            <div class="group">
                <span class="center"></span>
                <span class="circle circle-0"></span>
                <span class="circle circle-1"></span>
                <span class="circle circle-2"></span>
            </div>
        </div>
    </div>
    
    
    <!-- dialogue -->
    <div class="dialogue-box">
        <span class="dialogue-speaker"></span>
        <p class="dialogue-text"></p>
    </div>

    
    <!-- choix -->
    <div id="choices-container"></div>


    <!-- controles mobile -->
    <div class="mobile-controls">
        <div class="move-controls">
            <button class="mobile-btn mobile-btn--up" type="button" data-camera-key="z" aria-label="Avancer"></button>
            <button class="mobile-btn mobile-btn--left" type="button" data-camera-key="q" aria-label="Gauche"></button>
            <button class="mobile-btn mobile-btn--right" type="button" data-camera-key="d" aria-label="Droite"></button>
            <button class="mobile-btn mobile-btn--down" type="button" data-camera-key="s" aria-label="Reculer"></button>
        </div>

        <div class="height-controls">
            <button class="mobile-btn mobile-btn--rise" type="button" data-camera-key="space" aria-label="Monter"></button>
            <button class="mobile-btn mobile-btn--fall" type="button" data-camera-key="control" aria-label="Descendre"></button>
        </div>
    </div>


    <!-- indications controles clavier -->
    <div class="keyboard-controls">
        <div class="keyboard-controls__group">
            <span class="key">Z</span>
            <span class="key">Q</span>
            <span class="key">S</span>
            <span class="key">D</span>
            <span class="keyboard-controls__label">Déplacer</span>
        </div>

        <div class="keyboard-controls__group">
            <span class="key key--wide">Espace</span>
            <span class="keyboard-controls__label">Monter</span>
        </div>

        <div class="keyboard-controls__group">
            <span class="key key--wide">Ctrl</span>
            <span class="keyboard-controls__label">Descendre</span>
        </div>
    </div>


    <!-- responsive -->
    <div class="rotate-overlay" aria-live="polite" role="status">
        <div class="rotate-overlay__icon"></div>
        <p class="rotate-overlay__label">Veuillez tourner votre appareil</p>
    </div>

    <canvas class="webgl" aria-hidden="true"></canvas>


    <!-- script -->
    <script type="module" src="./script.js"></script>
</body>

</html>
